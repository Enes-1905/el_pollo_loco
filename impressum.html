<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Impressum</title>

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
    }

    body {
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
      overflow-x: hidden;
      overflow-y: auto;
    }

    * {
      box-sizing: border-box;
    }

    .page {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 32px 16px;
    }

    .wrapper {
      width: 100%;
      max-width: 720px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .back-btn {
      align-self: flex-start;
      padding: 10px 16px;
      border: none;
      border-radius: 8px;
      background: #ffcc00;
      color: #111;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.2s ease, background 0.2s ease;
    }

    .back-btn:hover {
      background: #ffd633;
      transform: translateY(-1px);
    }

    .container {
      width: 100%;
      background: rgba(255, 255, 255, 0.06);
      border-radius: 14px;
      padding: 24px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
    }

    h1 {
      font-size: 32px;
      margin: 0 0 20px 0;
    }

    h2 {
      font-size: 20px;
      margin: 18px 0 8px 0;
    }

    p {
      margin: 4px 0;
      line-height: 1.5;
      font-size: 16px;
      word-break: break-word;
    }

    a {
      color: #ffcc00;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    @media (max-width: 760px) {
      .page {
        padding: 20px 12px;
      }

      .wrapper {
        gap: 12px;
      }

      .container {
        padding: 18px 16px;
        border-radius: 10px;
      }

      h1 {
        font-size: 24px;
        margin-bottom: 14px;
      }

      h2 {
        font-size: 17px;
        margin: 12px 0 6px 0;
      }

      p {
        font-size: 14px;
        line-height: 1.4;
      }

      .back-btn {
        padding: 8px 12px;
        font-size: 14px;
      }
    }

    @media (max-width: 760px) and (max-height: 430px) and (orientation: landscape) {
      .page {
        padding: 10px;
      }

      .wrapper {
        gap: 10px;
      }

      .container {
        padding: 14px;
        border-radius: 8px;
      }

      h1 {
        font-size: 20px;
        margin-bottom: 10px;
      }

      h2 {
        font-size: 15px;
        margin: 10px 0 4px 0;
      }

      p {
        font-size: 12px;
        line-height: 1.3;
        margin: 2px 0;
      }

      .back-btn {
        padding: 7px 10px;
        font-size: 12px;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="wrapper">
      <button onclick="goBack()" class="back-btn">← Zurück</button>

      <div class="container">
        <h1>Impressum</h1>

        <p>Angaben gemäß § 5 TMG</p>
        <p>Enes Kurt</p>
        <p>Galatasaraystraße 1905</p>
        <p>1905 Galatasaray</p>
        <p>Deutschland</p>

        <h2>Kontakt</h2>
        <p>E-Mail: max@example.com</p>

        <h2>Haftungsausschluss</h2>
        <p>...</p>
        <p>...</p>
        <p>...</p>
      </div>
    </div>
  </div>

  <script>
    function goBack() {
      window.history.back();
    }
  </script>
</body>
</html>
