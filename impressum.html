<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Impressum</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
    }

    body {
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* 🔥 WRAPPER (fix für Button + Layout) */
    .wrapper {
      width: 100%;
      max-width: 620px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 20px;
      box-sizing: border-box;
    }

    /* 🔙 BUTTON */
    .back-btn {
      align-self: flex-start;
      padding: 10px 16px;
      border: none;
      border-radius: 8px;
      background: #ffcc00;
      font-weight: bold;
      cursor: pointer;
    }

    .container {
      width: 100%;
    }

    h1 {
      font-size: 32px;
      margin: 0 0 20px 0;
    }

    h2 {
      font-size: 20px;
      margin: 18px 0 8px 0;
    }

    p {
      margin: 4px 0;
      line-height: 1.45;
      font-size: 16px;
    }

    /* 📱 MOBILE */
    @media (max-width: 760px) {

      .wrapper {
        max-width: 92vw;
        padding: 16px;
      }

      h1 {
        font-size: 24px;
        margin-bottom: 14px;
      }

      h2 {
        font-size: 17px;
        margin: 12px 0 6px 0;
      }

      p {
        font-size: 14px;
        line-height: 1.35;
      }

      .back-btn {
        padding: 8px 12px;
        font-size: 14px;
      }
    }

    /* 📱 KLEINE LANDSCAPE (kritisch) */
    @media (max-width: 760px) and (max-height: 430px) and (orientation: landscape) {

      body {
        align-items: flex-start;
        overflow-y: auto;
      }

      .wrapper {
        max-width: 92vw;
        padding: 10px 14px;
      }

      h1 {
        font-size: 20px;
        margin-bottom: 10px;
      }

      h2 {
        font-size: 15px;
        margin: 8px 0 4px 0;
      }

      p {
        font-size: 12px;
        line-height: 1.2;
        margin: 2px 0;
      }
    }
  </style>
</head>

<body>

  <div class="wrapper">
    <button onclick="goBack()" class="back-btn">← Zurück</button>

    <div class="container">
      <h1>Impressum</h1>

      <p>Angaben gemäß §5 TMG</p>
      <p>Enes Kurt</p>
      <p>Galatasaraystraße 1905</p>
      <p>1905 Galatasaray</p>
      <p>Deutschland</p>

      <h2>Kontakt</h2>
      <p>E-Mail: max@example.com</p>

      <h2>Haftungsausschluss</h2>
      <p>...</p>
      <p>...</p>
      <p>...</p>
    </div>
  </div>

  <script>
    function goBack() {
      window.history.back();
    }
  </script>

</body>
</html>
