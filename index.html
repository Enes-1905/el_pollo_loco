<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>El Pollo Loco</title>
  <link rel="stylesheet" href="style.css" />

  <script src="models/drawable-object.class.js" defer></script>
  <script src="models/movable-object.class.js" defer></script>
  <script src="models/keyboard.class.js" defer></script>
  <script src="models/level.class.js" defer></script>
  <script src="models/background-object.class.js" defer></script>
  <script src="models/cloud.class.js" defer></script>
  <script src="models/bottle.class.js" defer></script>
  <script src="models/chicken.class.js" defer></script>
  <script src="models/endboss.class.js" defer></script>
  <script src="models/charackter.class.js" defer></script>
  <script src="models/throwable-object.class.js" defer></script>
  <script src="models/status.class.js" defer></script>
  <script src="models/world.class.js" defer></script>
  <script src="js/levels/level1.js" defer></script>
  <script src="js/game.js" defer></script>
</head>

<body>
  <div class="screen-wrapper">
    <div id="startscreen">
      <img src="img/9_intro_outro_screens/start/startscreen_1.png" alt="El Pollo Loco Startscreen">
      <button class="start-btn" onclick="startGame()">Start Game</button>
    </div>

    <div id="game-container" class="d-none">
      <h1>El Pollo Loco</h1>
      <div class="canvas-wrapper">
        <canvas id="canvas" width="720" height="480"></canvas>

        <div id="mobile-controls">
          <div class="mobile-left">
            <button id="btn-left" class="mobile-btn">←</button>
            <button id="btn-right" class="mobile-btn">→</button>
          </div>

          <div class="mobile-right">
            <button id="btn-jump" class="mobile-btn">Jump</button>
            <button id="btn-throw" class="mobile-btn">Throw</button>
          </div>
        </div>
      </div>
    </div>

    <div id="game-over-screen" class="end-screen d-none">
      <img src="img/9_intro_outro_screens/game_over/game over.png" alt="Game Over">
      <div class="end-screen-buttons">
        <button class="start-btn" onclick="restartGame()">Restart</button>
        <button class="start-btn" onclick="goToHome()">Home</button>
      </div>
    </div>

    <div id="you-win-screen" class="end-screen d-none">
      <img src="img/You won, you lost/You Win B.png" alt="You Win">
      <div class="end-screen-buttons">
        <button class="start-btn" onclick="restartGame()">Restart</button>
        <button class="start-btn" onclick="goToHome()">Home</button>
      </div>
    </div>

    <div id="rotate-device">
      <p>Bitte drehe dein Gerät</p>
    </div>
  </div>
     <footer style="position:fixed; bottom:10px; right:10px;">
  <a href="impressum.html" style="color:white; font-size:14px;">Impressum</a>
  
  <footer style="position:fixed; bottom:10px; right:10px; display:flex; gap:15px;">
  <a href="impressum.html" style="color:white; font-size:14px;">Impressum</a>
  <a href="datenschutz.html" style="color:white; font-size:14px;">Datenschutz</a>
</footer>
</footer>
</body>
</html>
